name: Incremental Mutation Testing

on:
  pull_request:
    paths:
      - "backend/src/**/*.py"
      - "!backend/src/**/migrations/**"
      - "!backend/src/**/tests/**"
      - "!backend/src/**/test_*.py"
      - "!backend/src/**/*_test.py"
      - "!backend/src/**/*_tests.py"
      - "!backend/src/**/settings*.py"
      - "frontend/src/**/*.ts"
      - "frontend/src/**/*.tsx"
      - "!frontend/src/**/*.test.ts"
      - "!frontend/src/**/*.test.tsx"
      - "!frontend/src/**/*.spec.ts"
      - "!frontend/src/**/*.spec.tsx"
      - "!frontend/src/**/*.d.ts"
      - "!frontend/src/**/__tests__/**"
      - "!frontend/src/types/api.ts"
      - "!frontend/src/**/contracts.ts"
      - "!frontend/src/setupTests.ts"
  push:
    branches: [main]
    paths:
      - "backend/src/**/*.py"
      - "!backend/src/**/migrations/**"
      - "!backend/src/**/tests/**"
      - "!backend/src/**/test_*.py"
      - "!backend/src/**/*_test.py"
      - "!backend/src/**/*_tests.py"
      - "!backend/src/**/settings*.py"
      - "frontend/src/**/*.ts"
      - "frontend/src/**/*.tsx"
      - "!frontend/src/**/*.test.ts"
      - "!frontend/src/**/*.test.tsx"
      - "!frontend/src/**/*.spec.ts"
      - "!frontend/src/**/*.spec.tsx"
      - "!frontend/src/**/*.d.ts"
      - "!frontend/src/**/__tests__/**"
      - "!frontend/src/types/api.ts"
      - "!frontend/src/**/contracts.ts"
      - "!frontend/src/setupTests.ts"

permissions:
  contents: read

jobs:
  mutation-testing:
    name: Changed-source mutation gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Compute changed source files
        id: changes
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > /tmp/changed-files.txt
          else
            git diff --name-only HEAD^ HEAD > /tmp/changed-files.txt
          fi

          while IFS= read -r file; do
            if [[ -f "$file" && "$file" =~ ^backend/src/.*\.py$ \
              && ! "$file" =~ /migrations/ \
              && ! "$file" =~ /tests?/ \
              && ! "$file" =~ /test_[^/]*\.py$ \
              && ! "$file" =~ /[^/]*_tests?\.py$ \
              && ! "$file" =~ /settings[^/]*\.py$ ]]; then
              printf '%s\n' "$file" >> /tmp/backend-changed.txt
            fi
            if [[ -f "$file" && "$file" =~ ^frontend/src/.*\.(ts|tsx)$ \
              && ! "$file" =~ \.(test|spec)\.(ts|tsx)$ \
              && ! "$file" =~ \.d\.ts$ \
              && ! "$file" =~ /__tests__/ \
              && "$file" != "frontend/src/types/api.ts" \
              && ! "$file" =~ /contracts\.ts$ \
              && "$file" != "frontend/src/setupTests.ts" ]]; then
              printf '%s\n' "$file" >> /tmp/frontend-changed.txt
            fi
          done < /tmp/changed-files.txt

          if [[ -s /tmp/backend-changed.txt ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -s /tmp/frontend-changed.txt ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: ${{ steps.changes.outputs.backend == 'true' }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        if: ${{ steps.changes.outputs.backend == 'true' }}
        run: python -m pip install -e './backend[dev]'

      - name: Run backend mutation gate
        if: ${{ steps.changes.outputs.backend == 'true' }}
        shell: bash
        run: |
          mapfile -t backend_files < <(sed 's#^backend/##' /tmp/backend-changed.txt)
          cd backend
          python scripts/mutation_gate.py "${backend_files[@]}"

      - name: Set up Node.js
        if: ${{ steps.changes.outputs.frontend == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ steps.changes.outputs.frontend == 'true' }}
        working-directory: frontend
        run: npm ci

      - name: Run frontend mutation gate
        if: ${{ steps.changes.outputs.frontend == 'true' }}
        working-directory: frontend
        shell: bash
        run: |
          sed 's#^frontend/##' /tmp/frontend-changed.txt > /tmp/frontend-changed-relative.txt
          mutate=$(node scripts/changed-mutation-ranges.mjs /tmp/frontend-changed-relative.txt)
          if [[ -z "$mutate" ]]; then
            echo "Mutation gate: no added or changed frontend lines; skipping."
            exit 0
          fi
          npx stryker run stryker.conf.json --coverageAnalysis off --mutate "$mutate"
