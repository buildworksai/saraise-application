# SPDX-License-Identifier: Apache-2.0
name: SARAISE CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  security-events: write

jobs:
  # Quality Gates - SARAISE-04001, SARAISE-04002, SARAISE-02013
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.17.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: "Regression guard: forbid Jest flags in CI commands"
        run: |
          matches="$(grep -R --line-number --fixed-strings -- '--watchAll' .github/workflows/*.yml || true)"
          # Ignore this guard's own grep invocation line(s).
          matches="$(printf '%s\n' "$matches" | grep -v --fixed-strings "-- '--watchAll'" || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "❌ Jest flag '--watchAll' found in workflow commands"
            exit 1
          fi

      - name: Detect backend Python project
        id: backend
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/setup.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Backend Quality Checks
      - name: Install Python dependencies
        if: ${{ steps.backend.outputs.present == 'true' }}
        run: |
          cd backend
          pip install -e .
          pip install -e .[dev,test]

      - name: Audit Python dependencies (SARAISE-26001)
        if: ${{ steps.backend.outputs.present == 'true' }}
        run: |
          cd backend
          pip install 'setuptools>=83.0.0'
          pip install pip-audit
          pip-audit . --desc --strict --skip-editable

      - name: Run Python linting (flake8)
        if: ${{ steps.backend.outputs.present == 'true' }}
        run: |
          cd backend
          python scripts/flake8_baseline.py check

      - name: Run Python formatting check (black)
        if: ${{ steps.backend.outputs.present == 'true' }}
        run: |
          cd backend
          black --check src/

      - name: Run Python import sorting check (isort)
        if: ${{ steps.backend.outputs.present == 'true' }}
        run: |
          cd backend
          isort --check-only src/

      - name: MyPy Type Check (Baseline + Ratcheting) - SARAISE-02013
        if: ${{ steps.backend.outputs.present == 'true' }}
        run: |
          cd backend
          python scripts/mypy_baseline.py check
          python scripts/test_mypy_baseline.py
        continue-on-error: false

      - name: Run Python tests with coverage
        if: ${{ steps.backend.outputs.present == 'true' }}
        env:
          DJANGO_USE_SQLITE_FOR_TESTS: '1'
          SARAISE_MODE: development
        run: |
          cd backend
          pytest src/ --cov=src --cov-report=xml --cov-report=term
        continue-on-error: false

      - name: Check Python coverage threshold (≥90%) - SARAISE-01002
        if: ${{ steps.backend.outputs.present == 'true' }}
        env:
          DJANGO_USE_SQLITE_FOR_TESTS: '1'
          SARAISE_MODE: development
        run: |
          cd backend
          coverage report --fail-under=90 || (echo "❌ Coverage below 90% threshold" && exit 1)

      # Frontend Quality Checks
      - name: Install Node.js dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Check (Zero Errors) - SARAISE-04002
        run: |
          cd frontend
          npm run typecheck
        continue-on-error: false

      - name: ESLint Check (Zero Warnings) - SARAISE-04001
        run: |
          cd frontend
          npm run lint
        continue-on-error: false

      - name: Run frontend tests with coverage
        run: |
          cd frontend
          npm test -- --coverage
        continue-on-error: false

      - name: Check frontend coverage threshold (≥90%) - SARAISE-01002
        run: |
          cd frontend
          if [ -f "coverage/coverage-summary.json" ]; then
            node -e "const s=require('./coverage/coverage-summary.json');const cov=s.total.lines.pct||0;if(cov<90){console.error('❌ Frontend coverage '+cov+'% is below 90% threshold');process.exit(1)}else{console.log('✅ Frontend coverage: '+cov+'%')}"
          else
            echo "❌ Coverage report missing - Test run failed to generate artifacts"
            exit 1
          fi

      - name: Build frontend (Phase 7.7 - fresh clone verification)
        run: |
          cd frontend
          npm run build
        continue-on-error: false

      # Security Scanning - SARAISE-01003, SARAISE-01004
      - name: Python security audit (pip-audit)
        if: ${{ steps.backend.outputs.present == 'true' }}
        run: |
          cd backend
          pip install 'setuptools>=83.0.0'
          pip install pip-audit
          pip-audit . --desc --strict --skip-editable || (echo "❌ Python dependency vulnerabilities found" && exit 1)

      - name: Node.js security audit
        run: |
          cd frontend
          npm run security:audit || (echo "❌ Security vulnerabilities found" && exit 1)

      # SAST - Static Application Security Testing (SARAISE-01005)
      - name: SAST Scan (Semgrep)
        run: |
          pip install semgrep
          SEMGREP_EXIT=0
          semgrep --config=auto --config=.semgrep/custom-rules.yaml \
            --json --output=semgrep-results.json \
            --error || SEMGREP_EXIT=$?

          if [ ! -f semgrep-results.json ]; then
            echo "❌ SAST scan did not produce semgrep-results.json"
            exit 1
          fi

          ERROR_COUNT=$(jq '(.errors // []) | length' semgrep-results.json)
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "⚠️ SAST scan reported $ERROR_COUNT nonfatal Semgrep parser diagnostics."
            jq '.errors' semgrep-results.json
          fi

          BLOCKING=$(jq '[((.results // [])[]) | select(.extra.is_ignored != true)] | length' semgrep-results.json)
          if [ "$BLOCKING" -gt 0 ]; then
            echo "❌ SAST found $BLOCKING blocking findings. Blocking merge."
            jq '.results[] | select(.extra.is_ignored != true)' semgrep-results.json
            exit 1
          fi

          if [ "$SEMGREP_EXIT" -ne 0 ]; then
            echo "❌ SAST scan failed with Semgrep exit code $SEMGREP_EXIT"
            exit "$SEMGREP_EXIT"
          fi

          echo "✅ SAST scan passed (no blocking findings or scan errors)"

          # Upload SARIF for GitHub Security tab
          semgrep --config=auto --config=.semgrep/custom-rules.yaml \
            --sarif --output=semgrep-results.sarif || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif
          wait-for-processing: false

  # Tenant Isolation Tests - Critical Security Gate
  tenant-isolation-tests:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'

      - name: Detect backend Python project
        id: backend
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/setup.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies
        if: ${{ steps.backend.outputs.present == 'true' }}
        run: |
          cd backend
          pip install -e .[dev,test]

      - name: Run tenant isolation tests
        if: ${{ steps.backend.outputs.present == 'true' }}
        env:
          DJANGO_USE_SQLITE_FOR_TESTS: '1'
          SARAISE_MODE: development
        run: |
          cd backend
          # Run only tests tagged with tenant isolation
          pytest src/ -v -k "isolation or tenant" --tb=short
        continue-on-error: false

  # Build and Test
  build-and-test:
    needs: [quality-gates, tenant-isolation-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build backend image
      - name: Build backend image
        if: ${{ hashFiles('backend/Dockerfile') != '' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container Security Scanning - Trivy (SARAISE-01006)
      - name: Scan backend container image (Trivy)
        id: trivy_backend
        if: ${{ hashFiles('backend/Dockerfile') != '' }}
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-api:test
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false

      - name: Upload Trivy backend SARIF
        if: always() && steps.trivy_backend.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: trivy-backend.sarif
          wait-for-processing: false

      # Build frontend image
      - name: Build frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container Security Scanning - Trivy (SARAISE-01006)
      - name: Scan frontend container image (Trivy)
        id: trivy_frontend
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:test
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: false

      - name: Upload Trivy frontend SARIF
        if: always() && steps.trivy_frontend.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: trivy-frontend.sarif
          wait-for-processing: false

  # Performance Baseline Check (New)
  performance-baseline:
    if: github.event_name == 'pull_request'
    needs: [quality-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check bundle sizes
        run: |
          cd frontend
          npm ci
          npm run build

          # Check main bundle size (gzipped)
          BUNDLE_SIZE=$(find dist -name '*.js' -exec gzip -c {} \; | wc -c)
          MAX_SIZE=614400  # 600KB total gzipped

          if [ "$BUNDLE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "❌ Bundle size ($BUNDLE_SIZE bytes) exceeds limit ($MAX_SIZE bytes)"
            exit 1
          else
            echo "✅ Bundle size: $BUNDLE_SIZE bytes (limit: $MAX_SIZE bytes)"
          fi

  # Deploy to Staging
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    needs: [quality-gates, tenant-isolation-tests, build-and-test]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Deploy to staging
        run: |
          if [ ! -f scripts/deploy-staging.sh ]; then
            echo "ℹ️ Skipping staging deploy: scripts/deploy-staging.sh not present"
            exit 0
          fi
          chmod +x scripts/deploy-staging.sh
          ./scripts/deploy-staging.sh
        env:
          DOCKER_REGISTRY: ${{ env.DOCKER_REGISTRY }}
          STAGING_POSTGRES_CONNECTION_STRING: ${{ secrets.STAGING_POSTGRES_CONNECTION_STRING }}
          STAGING_REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}

  # Deploy to Production
  deploy-production:
    if: github.ref == 'refs/heads/main'
    needs: [quality-gates, tenant-isolation-tests, build-and-test]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Deploy to production
        run: |
          if [ ! -f scripts/deploy-production.sh ]; then
            echo "ℹ️ Skipping production deploy: scripts/deploy-production.sh not present"
            exit 0
          fi
          chmod +x scripts/deploy-production.sh
          ./scripts/deploy-production.sh
        env:
          DOCKER_REGISTRY: ${{ env.DOCKER_REGISTRY }}
          POSTGRES_CONNECTION_STRING: ${{ secrets.PRODUCTION_POSTGRES_CONNECTION_STRING }}
          REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
          SESSION_SECRET_KEY: ${{ secrets.PRODUCTION_SESSION_SECRET_KEY }}
