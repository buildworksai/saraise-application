# ===================================
# SARAISE OpenAPI Schema Validation
# ===================================
# Validates OpenAPI schema generation and consistency
# ===================================

name: OpenAPI Schema Validation

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  validate-openapi:
    name: Validate OpenAPI Schema
    runs-on: ubuntu-latest
    env:
      OPENAPI_SCHEMA_ERROR_BASELINE: "4628"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          cd backend
          pip install -e .[dev]
          pip install openapi-spec-validator

      - name: Configure Django
        run: |
          echo "SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"
          echo "ALLOWED_HOSTS=localhost" >> "$GITHUB_ENV"

      - name: Generate OpenAPI Schema
        id: generate
        run: |
          cd backend
          set -o pipefail
          python manage.py spectacular --file schema.yaml --format openapi-json --validate 2>&1 | tee /tmp/spectacular-output.txt

          schema_errors="$(sed -n 's/^Errors: *\([0-9][0-9]*\).*/\1/p' /tmp/spectacular-output.txt | tail -1)"
          if [ -z "$schema_errors" ]; then
            echo "drf-spectacular did not report an error count"
            exit 1
          fi
          if [ "$schema_errors" -gt "$OPENAPI_SCHEMA_ERROR_BASELINE" ]; then
            echo "drf-spectacular reported $schema_errors schema-generation errors, exceeding baseline $OPENAPI_SCHEMA_ERROR_BASELINE"
            exit 1
          fi
          if [ "$schema_errors" -gt 0 ]; then
            echo "::warning::drf-spectacular reported $schema_errors known schema-generation errors; baseline budget is $OPENAPI_SCHEMA_ERROR_BASELINE"
          fi
          echo "schema_errors=$schema_errors" >> "$GITHUB_OUTPUT"

      - name: Validate OpenAPI Schema
        if: ${{ steps.generate.outputs.schema_errors == '0' }}
        run: |
          python3 - <<'PY'
          import yaml
          from openapi_spec_validator import validate_spec

          with open("backend/schema.yaml") as schema_file:
              spec = yaml.safe_load(schema_file)

          validate_spec(spec)
          print("OpenAPI schema is valid")
          PY

      - name: Check Schema Completeness
        if: ${{ steps.generate.outputs.schema_errors == '0' }}
        run: |
          python3 - <<'PY'
          import yaml

          with open("backend/schema.yaml") as schema_file:
              spec = yaml.safe_load(schema_file)

          paths = spec.get("paths", {})
          required_prefixes = ("/api/v1/crm/", "/api/v1/platform/")
          missing = [prefix for prefix in required_prefixes if not any(path.startswith(prefix) for path in paths)]

          if missing:
              raise SystemExit(f"Missing API path prefixes in schema: {missing}")

          print("All required API path prefixes are present")
          PY
