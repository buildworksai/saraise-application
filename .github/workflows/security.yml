# SPDX-License-Identifier: Apache-2.0
# ===================================
# SARAISE Security Scanning (DAST)
# ===================================
# Dynamic Application Security Testing using OWASP ZAP
# BLOCKING: CRITICAL findings block merge
# ===================================

name: Security Scan (DAST)

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dast:
    name: DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.17.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Start application services
        run: |
          docker network create saraise-network || true
          docker compose -f docker-compose.dev.yml up -d backend
          # Wait for services to be ready
          if ! timeout 300 bash -c 'until curl -f http://localhost:28000/metrics/; do sleep 2; done'; then
            docker compose -f docker-compose.dev.yml ps
            docker compose -f docker-compose.dev.yml logs --no-color --tail=250 backend postgres redis
            exit 1
          fi

      - name: Dump service logs on startup failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color --tail=250 backend postgres redis

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25
        with:
          target: 'http://localhost:28000'
          rules_file_name: '.zap/rules.tsv'
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-scan
          cmd_options: '-a'

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zap-report
          path: report_html.html
          retention-days: 30

      - name: Check for critical findings
        if: always()
        run: |
          if [ -f report_json.json ]; then
            CRITICAL=$(jq '[.site[] | .alerts[] | select(.riskcode == "4")] | length' report_json.json || echo "0")
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ DAST found $CRITICAL critical findings. Blocking merge."
              exit 1
            else
              echo "✅ DAST scan passed (no critical findings)"
            fi
          else
            echo "❌ ZAP JSON report was not generated; cannot evaluate critical findings."
            exit 1
          fi

      - name: Stop application services
        if: always()
        run: docker compose -f docker-compose.dev.yml down
