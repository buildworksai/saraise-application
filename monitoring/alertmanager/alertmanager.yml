# SARAISE Alertmanager configuration
# Reference: docs/architecture/operational-runbooks.md § 4.1

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  # Local application UAT has no alert webhook receiver in docker-compose.dev.yml.
  # Route alerts to an explicit no-op receiver so Alertmanager does not retry
  # against its own container localhost and flood logs with delivery failures.
  - name: default
